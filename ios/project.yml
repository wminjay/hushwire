name: HushWireIOS

options:
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 95Q852BXKJ
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: 0.7.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HushWireIOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - HushWireIOS.entitlements
      - path: Shared
      - path: ../macos/SystemExtension/Shared
        excludes:
          - HushWireConfigurationStore.swift
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/HushWireIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jamie.HushWire.iOS
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: HushWirePacketTunnel
        embed: true
      - framework: ../dist/HushWireCore-iOS.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: Security.framework

  HushWirePacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - Info.plist
          - HushWirePacketTunnel.entitlements
      - path: Shared
      - path: ../macos/SystemExtension/Shared
        excludes:
          - HushWireConfigurationStore.swift
      - path: ../macos/SystemExtension/PacketTunnel
        excludes:
          - Info.plist
          - HushWirePacketTunnel.entitlements
          - HushWirePacketTunnel.direct.entitlements
          - main.swift
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/HushWirePacketTunnel.entitlements
        INFOPLIST_FILE: PacketTunnel/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.jamie.HushWire.iOS.PacketTunnel
        PRODUCT_MODULE_NAME: HushWirePacketTunnel
        PRODUCT_NAME: HushWirePacketTunnel
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - framework: ../dist/HushWireCore-iOS.xcframework
        embed: false

  HushWireIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jamie.HushWire.iOS.Tests
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: HushWireIOS

  HushWireIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jamie.HushWire.iOS.UITests
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: HushWireIOS
    dependencies:
      - target: HushWireIOS

schemes:
  HushWireIOS:
    build:
      targets:
        HushWireIOS: all
        HushWirePacketTunnel: all
        HushWireIOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HushWireIOSTests
        - HushWireIOSUITests
    archive:
      config: Release
