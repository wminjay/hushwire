<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>HushWire - First Launch</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#2563eb', // blue-600
                            hover: '#1d4ed8', // blue-700
                            container: '#dbeafe', // blue-100
                            on_container: '#1e3a8a', // blue-900
                        },
                        background: '#f8fafc', // slate-50
                        surface: '#ffffff',
                        surface_variant: '#f1f5f9', // slate-100
                        outline: '#e2e8f0', // slate-200
                        on_surface: '#0f172a', // slate-900
                        on_surface_variant: '#64748b', // slate-500
                        error: '#ef4444', // red-500
                        success: '#10b981', // emerald-500
                        warning: '#f59e0b', // amber-500
                    },
                    fontFamily: {
                        headline: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Inter", "sans-serif"]
                    },
                    spacing: {
                        safe_top: 'env(safe-area-inset-top, 47px)',
                        safe_bottom: 'env(safe-area-inset-bottom, 34px)'
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center justify-start overflow-x-hidden pt-safe_top pb-safe_bottom w-full max-w-[430px] mx-auto relative shadow-xl shadow-slate-200/50">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-black/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 flat no shadows max-w-[430px] mx-auto left-0 right-0">
<div class="flex items-center justify-between px-4 h-11 pt-[env(safe-area-inset-top,47px)] box-content">
<button aria-label="Security" class="w-11 h-11 flex items-center justify-center text-blue-600 dark:text-blue-400 active:opacity-60 transition-opacity active:scale-95 duration-100 -ml-2">
<span class="material-symbols-outlined" data-icon="shield_lock">shield_lock</span>
</button>
<h1 class="font-headline font-bold text-[17px] text-slate-900 dark:text-slate-100 tracking-tight">HushWire</h1>
<button aria-label="Settings" class="w-11 h-11 flex items-center justify-center text-blue-600 dark:text-blue-400 active:opacity-60 transition-opacity active:scale-95 duration-100 -mr-2">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full px-6 flex flex-col items-center pt-24 pb-24 relative z-10">
<!-- Hero Illustration (SF Symbol Style Geometric) -->
<div class="mb-8 mt-4 relative w-32 h-32 flex items-center justify-center">
<div class="absolute inset-0 bg-primary-container rounded-full opacity-50 blur-xl"></div>
<div class="w-24 h-24 bg-white rounded-3xl shadow-sm border border-outline flex items-center justify-center relative z-10 rotate-3">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'wght' 300;">shield_person</span>
</div>
<div class="absolute top-4 right-4 w-6 h-6 bg-white rounded-full shadow-sm border border-outline flex items-center justify-center z-20 -rotate-6">
<span class="material-symbols-outlined text-[14px] text-on_surface_variant">vpn_key</span>
</div>
<div class="absolute bottom-4 left-4 w-8 h-8 bg-white rounded-full shadow-sm border border-outline flex items-center justify-center z-20">
<span class="material-symbols-outlined text-[16px] text-success">check_circle</span>
</div>
</div>
<!-- Header Text -->
<div class="text-center mb-10 w-full">
<h2 class="text-2xl font-bold font-headline text-on_surface mb-3">添加连接配置</h2>
<p class="text-[15px] leading-relaxed text-on_surface_variant px-2">导入受信任的 HushWire TOML，之后由 iOS 管理 VPN 连接</p>
</div>
<!-- Trust Steps Bento -->
<div class="w-full bg-surface rounded-2xl shadow-sm border border-outline/60 p-1 mb-8">
<div class="flex flex-col gap-1">
<!-- Step 1 -->
<div class="flex items-start gap-4 p-4 rounded-xl bg-surface_variant/30">
<div class="w-10 h-10 rounded-full bg-primary/10 flex flex-shrink-0 items-center justify-center mt-0.5">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="file_open">file_open</span>
</div>
<div class="flex flex-col">
<span class="font-semibold text-[15px] text-on_surface mb-1">导入 TOML</span>
<span class="text-[13px] text-on_surface_variant">在本机读取并验证</span>
</div>
</div>
<!-- Step 2 -->
<div class="flex items-start gap-4 p-4 rounded-xl bg-surface_variant/30">
<div class="w-10 h-10 rounded-full bg-primary/10 flex flex-shrink-0 items-center justify-center mt-0.5">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="route">route</span>
</div>
<div class="flex flex-col">
<span class="font-semibold text-[15px] text-on_surface mb-1">确认网络范围</span>
<span class="text-[13px] text-on_surface_variant">查看指定地址、分流或全局模式</span>
</div>
</div>
<!-- Step 3 -->
<div class="flex items-start gap-4 p-4 rounded-xl bg-surface_variant/30">
<div class="w-10 h-10 rounded-full bg-primary/10 flex flex-shrink-0 items-center justify-center mt-0.5">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="vpn_lock">vpn_lock</span>
</div>
<div class="flex flex-col">
<span class="font-semibold text-[15px] text-on_surface mb-1">允许 VPN 配置</span>
<span class="text-[13px] text-on_surface_variant">首次连接时由 iOS 请求</span>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-4 mb-8">
<button class="w-full h-[50px] bg-primary text-white font-semibold text-[17px] rounded-xl active:bg-primary-hover transition-colors shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[20px]" data-icon="add_circle">add_circle</span>
                导入 TOML 配置
            </button>
<button class="w-full h-[44px] text-primary font-medium text-[15px] active:opacity-60 transition-opacity flex items-center justify-center">
                生成客户端密钥
            </button>
</div>
<!-- Footer Notes -->
<div class="w-full mt-auto flex flex-col gap-3 px-2">
<div class="flex items-start gap-2">
<span class="material-symbols-outlined text-[14px] text-on_surface_variant mt-0.5" data-icon="lock">lock</span>
<p class="text-[12px] text-on_surface_variant leading-tight">私钥仅保存在本机安全容器，不会显示在诊断报告中</p>
</div>
<div class="flex items-start gap-2">
<span class="material-symbols-outlined text-[14px] text-warning mt-0.5" data-icon="info">info</span>
<p class="text-[12px] text-on_surface_variant leading-tight">只导入你信任来源的配置文件</p>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 pb-safe bg-white/80 dark:bg-black/80 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 flat no shadows max-w-[430px] mx-auto right-0">
<div class="h-[49px] flex justify-around items-center">
<!-- Inactive: 连接 -->
<button aria-label="连接" class="flex flex-col items-center justify-center w-full h-full active:bg-slate-50 dark:active:bg-slate-900 transition-colors group">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 mb-0.5 group-active:scale-95 transition-transform" data-icon="bolt">bolt</span>
<span class="font-label text-[10px] font-medium text-slate-400 dark:text-slate-500">连接</span>
</button>
<!-- Active: 配置 (Semantically matching the import/setup context) -->
<button aria-label="配置" class="flex flex-col items-center justify-center w-full h-full active:bg-slate-50 dark:active:bg-slate-900 transition-colors group">
<span class="material-symbols-outlined text-blue-600 dark:text-blue-400 mb-0.5 group-active:scale-95 transition-transform icon-fill" data-icon="tune" data-weight="fill">tune</span>
<span class="font-label text-[10px] font-medium text-blue-600 dark:text-blue-400">配置</span>
</button>
<!-- Inactive: 诊断 -->
<button aria-label="诊断" class="flex flex-col items-center justify-center w-full h-full active:bg-slate-50 dark:active:bg-slate-900 transition-colors group">
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500 mb-0.5 group-active:scale-95 transition-transform" data-icon="analytics">analytics</span>
<span class="font-label text-[10px] font-medium text-slate-400 dark:text-slate-500">诊断</span>
</button>
</div>
</nav>
</body></html>
