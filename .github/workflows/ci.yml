name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (TUN support)
        run: sudo apt-get update && sudo apt-get install -y build-essential iproute2 iptables iputils-ping musl-tools

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: |
          cargo build --release
          cargo build --release --target x86_64-unknown-linux-musl

      - name: Test
        run: cargo test --release

      - name: Test UDP/TCP recovery and multi-peer isolation in network namespaces
        run: |
          sudo ./tests/recovery_netns.sh target/release/hushwire udp
          sudo ./tests/recovery_netns.sh target/release/hushwire tcp
          sudo ./tests/multipeer_netns.sh target/release/hushwire udp
          sudo ./tests/multipeer_netns.sh target/release/hushwire tcp

      - name: Test LAN gateway policy in isolated network namespaces
        run: sudo ./tests/gateway_netns.sh target/release/hushwire

      - name: Upload Linux binary for isolated deployment testing
        uses: actions/upload-artifact@v4
        with:
          name: hushwire-linux-x86_64-ci
          path: target/x86_64-unknown-linux-musl/release/hushwire
          retention-days: 1

  macos-client:
    name: Build & Test macOS Client
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-client-aarch64

      - name: Test Swift client logic
        run: swift test --package-path macos

      - name: Validate control scripts
        run: |
          zsh -n macos/Resources/hushwire-control macos/scripts/build-app.sh
          bash -n macos/scripts/package-system-extension.sh
          plutil -lint \
            macos/SystemExtension/App/HushWire.direct.entitlements \
            macos/SystemExtension/PacketTunnel/HushWirePacketTunnel.direct.entitlements
          grep -q 'packet-tunnel-provider-systemextension' \
            macos/SystemExtension/App/HushWire.direct.entitlements
          grep -q 'packet-tunnel-provider-systemextension' \
            macos/SystemExtension/PacketTunnel/HushWirePacketTunnel.direct.entitlements
          test "$(plutil -extract NetworkExtension.NEMachServiceName raw -o - \
            macos/SystemExtension/PacketTunnel/Info.plist)" = \
            '95Q852BXKJ.com.jamie.HushWire.shared.PacketTunnel'
          set +e
          output=$(macos/Resources/hushwire-control status "$(id -u)")
          result=$?
          set -e
          test "$result" -eq 3
          test "$output" = "stopped"

      - name: Build and verify Apple Silicon app bundle
        env:
          HUSHWIRE_RUST_TARGET: aarch64-apple-darwin
          HUSHWIRE_SWIFT_ARCH: arm64
        run: |
          ./macos/scripts/build-app.sh
          codesign --verify --deep --strict dist/HushWire.app
          lipo dist/HushWire.app/Contents/MacOS/HushWire -verify_arch arm64
          lipo dist/HushWire.app/Contents/Resources/bin/hushwire -verify_arch arm64
          expected_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$(dist/HushWire.app/Contents/Resources/bin/hushwire --version)" = "hushwire $expected_version"

      - name: Smoke-test privileged start and stop with no routes
        run: |
          test_directory=$(mktemp -d)
          control="$PWD/dist/HushWire.app/Contents/Resources/bin/hushwire-control"
          binary="$PWD/dist/HushWire.app/Contents/Resources/bin/hushwire"
          log_file="$test_directory/tunnel.log"
          touch "$log_file"
          cleanup() {
            sudo "$control" stop "$(id -u)" >/dev/null 2>&1 || true
            rm -rf -- "$test_directory"
          }
          trap cleanup EXIT

          sudo "$control" start "$(id -u)" "$binary" \
            "$PWD/tests/fixtures/macos-no-routes.toml" "$log_file"
          sudo "$control" status "$(id -u)" | grep -q '^running '
          grep -q 'tunnel started' "$log_file"
          sudo "$control" stop "$(id -u)"
          test ! -e "/var/run/hushwire-$(id -u).pid"
